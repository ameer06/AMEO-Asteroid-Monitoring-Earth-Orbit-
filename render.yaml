# Render Blueprint — $0 deploy with Neon database (see START-HERE.md)

services:
  - type: web
    name: ameo-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: NASA_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://frontend-lac-zeta-37.vercel.app
      - key: POLL_INTERVAL_MINUTES
        value: "15"
      - key: ALERT_THRESHOLD_LD
        value: "5"

  - type: web
    name: ameo-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ameo-api
          envVarKey: RENDER_EXTERNAL_URL
