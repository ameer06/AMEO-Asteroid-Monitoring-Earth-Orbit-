# Render Blueprint — deploy from GitHub: Dashboard → New → Blueprint
# Repo: https://github.com/ameer06/AMEO-Asteroid-Monitoring-Earth-Orbit-

databases:
  - name: ameo-db
    plan: free
    databaseName: neodb
    user: neouser

services:
  - type: web
    name: ameo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NASA_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ameo-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "15"
      - key: ALERT_THRESHOLD_LD
        value: "5"

  - type: web
    name: ameo-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ameo-api
          envVarKey: RENDER_EXTERNAL_URL
