# $0 long-term deploy — use with Neon Postgres (Render free DB expires in 30 days).
# Render Dashboard → New → Blueprint → use this file OR paste as custom blueprint.
#
# Before deploy: create Neon DB, then set DATABASE_URL on ameo-api when prompted.

services:
  - type: web
    name: ameo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NASA_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "15"
      - key: ALERT_THRESHOLD_LD
        value: "5"

  - type: web
    name: ameo-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ameo-api
          envVarKey: RENDER_EXTERNAL_URL
